<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 课信</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.min.css"><link rel="stylesheet" href="/static/app.css?v=readability-2"></head><body class="login-page"><main class="login-shell"><section class="login-story"><div class="brand"><span class="brand-mark"><i class="bi bi-envelope-paper"></i></span><div><strong>课信<span class="brand-en">CLASSNOTE</span></strong><small>作业邮件提醒助手</small></div></div><div class="login-story-copy"><div class="eyebrow">A LITTLE REMINDER. A LOT LESS WORRY.</div><h1>提醒有条理，<br>教学少忙乱<span class="heading-dot">。</span></h1><p>从班级名单到一封妥帖的邮件，<br>把课程沟通留在你熟悉的节奏里。</p><div class="login-features"><span><i class="bi bi-check2-circle"></i> 多邮箱自由切换</span><span><i class="bi bi-check2-circle"></i> 一人一封，独立收件</span><span><i class="bi bi-check2-circle"></i> 名单与通知本地保存</span></div></div><div class="login-footnote">为每一次认真教学，留一点从容。</div></section><section class="login-form-area"><div class="login-card"><span class="login-icon"><i class="bi bi-door-open"></i></span><h2 id="login-title">欢迎回来</h2><p id="login-description" class="muted">输入管理员密码，进入你的本地工作空间。</p><form id="login-form"><label class="form-label" for="password">管理员密码</label><input class="form-control form-control-lg" id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" placeholder="至少 12 个字符" required><div id="confirm-field" class="mt-3" hidden><label class="form-label" for="confirm-password">确认密码</label><input id="confirm-password" class="form-control form-control-lg" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><div id="login-error" class="dialog-error mt-3" role="alert"></div><button class="btn btn-primary btn-lg w-100 mt-3" id="login-submit" type="submit">进入工作空间 <i class="bi bi-arrow-right"></i></button></form><div class="login-security"><i class="bi bi-shield-exclamation"></i><p>HTTP 连接未加密，仅用于可信私人网络。<br>首次设置密码需在运行服务的电脑上完成。</p></div></div></section></main><script src="/static/login.js" defer></script></body></html>
