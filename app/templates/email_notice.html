<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>{{ subject }}</title>
<style>
body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}table,td{mso-table-lspace:0pt;mso-table-rspace:0pt}table{border-collapse:separate}img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}a{word-break:break-word}
@media only screen and (max-width:700px){.notice-title{font-size:34px!important;letter-spacing:-.8px!important}.hero-art{width:130px!important}.hero-art img{width:130px!important;height:auto!important}.info-value{font-size:20px!important}}
@media only screen and (max-width:540px){.outer-pad{padding:14px 10px!important}.card-pad{padding-left:24px!important;padding-right:24px!important}.header-pad{padding-top:26px!important}.hero-pad{padding-top:30px!important;padding-bottom:26px!important}.notice-title{font-size:30px!important;line-height:1.35!important}.notice-subtitle{font-size:16px!important}.hero-art{width:84px!important}.hero-art img{width:96px!important;height:auto!important}.info-label{display:none!important}.info-value{border-left:0!important;padding-left:12px!important;font-size:19px!important}.mobile-label{display:block!important;font-size:12px!important;font-weight:400!important;color:#687991!important;margin:0 0 5px!important}.info-card{padding:8px 18px!important}.notice-body{font-size:17px!important}.notice-greeting{font-size:20px!important}.submit-table{width:100%!important}.submit-link{font-size:20px!important;padding:16px 20px!important}.contact-pad{padding-top:24px!important;padding-bottom:28px!important}.contact-copy{font-size:13px!important}.signature{font-size:12px!important}}
@media only screen and (max-width:420px){.card-pad{padding-left:20px!important;padding-right:20px!important}.hero-art{display:none!important;width:0!important}.notice-wordmark{display:none!important}.course-label{font-size:15px!important}.contact-icon{width:34px!important}.contact-icon img{width:32px!important;height:32px!important}.info-icon{width:36px!important}.info-icon img{width:34px!important;height:34px!important}}
</style></head>
<body style="margin:0;padding:0;background:#f1f5fa;color:#42516b;font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5fa"><tr><td class="outer-pad" align="center" style="padding:24px 16px">
<!--[if mso]><table role="presentation" width="760" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:760px;background:#ffffff;border-radius:20px;border:1px solid #eaf0f6;overflow:hidden">
<tr><td class="card-pad header-pad" style="padding:34px 40px 0">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td width="45" valign="middle" style="padding-right:16px"><img src="{{ images.course }}" width="36" height="36" alt="" style="display:block;width:36px;height:36px"></td><td class="course-label" valign="middle" style="border-left:1px solid #cfd9e8;padding-left:18px;font-size:17px;line-height:1.6;font-weight:500;color:#61718a">课程通知 · {{ course }}</td><td class="notice-wordmark" align="right" valign="middle" style="padding-left:12px;font-size:11px;line-height:1.7;letter-spacing:2.5px;color:#61718a;white-space:nowrap">COURSE NOTICE</td></tr></table>
</td></tr>
<tr><td class="card-pad hero-pad" style="padding:38px 40px 28px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td valign="middle"><h1 class="notice-title" style="font-size:44px;line-height:1.28;font-weight:800;letter-spacing:-1.3px;color:#07152f;margin:0;overflow-wrap:anywhere">{{ title }}</h1><table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0 17px"><tr><td width="44" height="5" style="width:44px;height:5px;background:#f26b45;border-radius:4px;font-size:0;line-height:0">&nbsp;</td></tr></table><p class="notice-subtitle" style="font-size:17px;line-height:1.8;color:#61718a;margin:0">请及时完成并提交作业，合理安排学习时间。</p></td><td class="hero-art" width="170" valign="bottom" align="right" style="width:170px;padding-left:4px"><img src="{{ images.hero }}" width="170" height="132" alt="" style="display:block;width:170px;height:auto"></td></tr></table>
</td></tr>
<tr><td class="card-pad" style="padding:0 40px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff6f1;border-radius:12px"><tr><td class="info-card" style="padding:10px 24px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="info-icon" width="48" valign="middle" style="width:48px;padding:12px 0"><img src="{{ images.assignment }}" width="40" height="40" alt="" style="display:block;width:40px;height:40px"></td><td class="info-label" width="92" valign="middle" style="width:92px;padding:12px 10px 12px 14px;color:#61718a;font-size:17px;line-height:1.6">本次作业</td><td class="info-value" valign="middle" style="padding:10px 0 10px 24px;border-left:1px solid #d9dce3;color:#07152f;font-size:23px;line-height:1.55;font-weight:700;overflow-wrap:anywhere"><span class="mobile-label" style="display:none">本次作业</span>{{ assignment }}</td></tr><tr><td colspan="3" height="1" style="height:1px;font-size:0;line-height:0;background:#f5e6df">&nbsp;</td></tr><tr><td class="info-icon" width="48" valign="middle" style="width:48px;padding:14px 0 12px"><img src="{{ images.clock }}" width="40" height="40" alt="" style="display:block;width:40px;height:40px"></td><td class="info-label" width="92" valign="middle" style="width:92px;padding:12px 10px 12px 14px;color:#61718a;font-size:17px;line-height:1.6">截止时间</td><td class="info-value" valign="middle" style="padding:10px 0 10px 24px;border-left:1px solid #d9dce3;color:#d65330;font-size:23px;line-height:1.55;font-weight:700;overflow-wrap:anywhere"><span class="mobile-label" style="display:none">截止时间</span>{{ deadline }}</td></tr></table>
</td></tr></table>
</td></tr>
<tr><td class="card-pad" style="padding:26px 40px 0"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td height="1" style="height:1px;font-size:0;line-height:0;background:#dfe6ef">&nbsp;</td></tr></table></td></tr>
<tr><td class="card-pad notice-body" style="padding:30px 40px 14px;font-size:19px;line-height:1.9;color:#42516b;overflow-wrap:anywhere;word-break:break-word">{{ body_html }}</td></tr>
<tr><td class="card-pad" style="padding:8px 40px 30px"><table role="presentation" class="submit-table" width="300" cellpadding="0" cellspacing="0" style="width:300px"><tr><td align="center" bgcolor="#ee6842" style="background:#ee6842;border:1px solid #e85d36;border-radius:10px;mso-padding-alt:16px 32px"><a class="submit-link" href="{{ target }}" style="display:block;padding:16px 32px;font-size:20px;line-height:1.45;font-weight:700;color:#ffffff;text-decoration:none;text-align:center">{{ action }}</a></td></tr></table></td></tr>
<tr><td class="card-pad" style="padding:0 40px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td height="1" style="height:1px;font-size:0;line-height:0;background:#dfe6ef">&nbsp;</td></tr></table></td></tr>
<tr><td class="card-pad contact-pad" style="padding:24px 40px 26px"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="contact-icon" width="48" valign="top" style="width:48px;padding-right:14px"><img src="{{ images.contact }}" width="40" height="40" alt="" style="display:block;width:40px;height:40px"></td><td class="contact-copy" valign="middle" style="font-size:14px;line-height:1.8;color:#61718a">{{ hint }}<br><a href="{{ target }}" style="font-size:16px;line-height:1.8;color:#176ac6;text-decoration:underline;word-break:break-all">{{ destination }}</a></td></tr></table></td></tr>
<tr><td class="card-pad signature" style="padding:0 40px 28px;color:#61718a;font-size:12px;line-height:1.8">{{ course }} · {{ class_name }}<br>本邮件由课程助教发送，如有疑问请直接回复。</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table></body></html>
